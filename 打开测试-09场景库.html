<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Drill 场景库测试入口</title>
    <style>
      body {
        margin: 0;
        background: #f5f6f8;
        color: #111827;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      main {
        max-width: 840px;
        margin: 48px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      a {
        display: inline-block;
        margin: 20px 0;
        padding: 12px 18px;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        text-decoration: none;
      }

      li {
        margin: 10px 0;
        line-height: 1.7;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #eef1f4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Product Drill 测试入口：09 场景库</h1>
      <p>本轮测试重点是场景库是否能作为训练入口使用，并把选择的行业场景带入训练工作台。</p>
      <a href="http://127.0.0.1:3000">打开本地测试应用</a>
      <ol>
        <li>进入应用后点击“进入工作台”。</li>
        <li>点击左侧“场景库”。</li>
        <li>确认能看到 <code>B2B</code>、<code>AI+</code>、<code>企业员工培训</code> 三个场景说明。</li>
        <li>分别点击每个场景卡片里的“用 当前场景 开始训练”。</li>
        <li>确认页面回到“训练工作台”，且“行业场景”下拉框自动切换为刚刚选择的场景。</li>
        <li>点击“开始训练”，确认 AI 第一句话中出现对应的当前场景。</li>
      </ol>
      <p>预期结果：三个场景都能一键进入训练工作台，并自动带入正确场景。</p>
    </main>
  </body>
</html>
