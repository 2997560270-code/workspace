name: Bug report
description: 报告可复现的 Product Drill 问题
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与版本
      placeholder: preview / production，commit SHA，浏览器
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 附件和描述不包含对话原文、邮箱、Token、Cookie 或其他敏感信息
          required: true
