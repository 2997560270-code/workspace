name: Product Drill CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:

concurrency:
  group: product-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-drill-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-drill-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval:golden
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-drill-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product-drill-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: product-drill-app/playwright-report
          retention-days: 7
