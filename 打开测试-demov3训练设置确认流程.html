<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打开测试 - demov3 训练设置确认流程</title>
  <style>
    :root {
      --text: #111513;
      --muted: #66726d;
      --line: #e3e7e5;
      --surface: #ffffff;
      --surface-2: #f5f7f6;
      --dark: #070909;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fbfbfa;
      color: var(--text);
      font: 14px/1.7 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    main {
      width: min(680px, calc(100vw - 40px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border-radius: 6px;
      background: var(--dark);
      color: #fff;
      padding: 0 18px;
      text-decoration: none;
      font-weight: 700;
    }

    code {
      display: block;
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
      padding: 12px;
      color: var(--text);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>demov3 训练设置确认流程测试入口</h1>
    <p>这个入口用于测试 demov3 训练设置确认、确定更改和历史归档流程，不影响总验收入口。</p>
    <a href="demov3.html">打开 demov3 测试页面</a>
    <code>推荐双击同目录下的 打开测试-demov3训练设置确认流程.cmd，它会自动启动本地服务并打开这个测试入口；直接打开本 HTML 时，按钮会使用同目录下的 demov3.html。</code>
  </main>
</body>
</html>
